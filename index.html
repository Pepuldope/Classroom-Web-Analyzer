<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Web Analyzer</title>
<link rel="stylesheet" href="/styles.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
<header>
  <h1>Classroom Analyzer</h1>
  <div id="auth">
    <span id="userInfo" class="user-info" hidden></span>
    <button id="logoutBtn" hidden>Sign out</button>
  </div>
</header>

<main>
  <section id="status" class="status"></section>

  <section id="welcome">
    <div class="welcome-card">
      <h2 class="welcome-title">Get your study plan in 3 clicks 👇</h2>

      <ol class="welcome-steps">
        <li>
          <span class="step-num">1</span>
          <div class="step-text">Hit the button below</div>
        </li>
        <li>
          <span class="step-num">2</span>
          <div class="step-text">Pick your school Google account</div>
        </li>
        <li>
          <span class="step-num">3</span>
          <div class="step-text">Tick <strong>all the boxes</strong> ✅ — we need all of them</div>
        </li>
      </ol>

      <button id="loginBtn" class="primary big-login">Sign in with Google</button>
    </div>
  </section>

  <section id="report" hidden>
    <div id="statBar" class="stat-bar"></div>

    <h2>Do today / tomorrow</h2>
    <div id="doNowList" class="list"></div>

    <h2>This week</h2>
    <div id="weekList" class="list"></div>

    <h2 class="small-h">New since yesterday</h2>
    <div id="todayList" class="list compact"></div>

    <details id="restWrap">
      <summary><h2 class="small-h inline">Everything else pending</h2></summary>
      <div id="fullList" class="list"></div>
    </details>
  </section>
</main>

<aside id="ai" hidden>
  <header>
    <h3 id="aiTitle">AI Assistant</h3>
    <button id="aiClose" aria-label="Close">×</button>
  </header>
  <div id="aiContext" class="ai-context"></div>
  <div id="aiMessages" class="ai-messages"></div>
  <form id="aiForm" class="ai-form">
    <input id="aiInput" type="text" placeholder="Ask about this assignment…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <div class="ai-quick">
    <button data-prompt="Make me a structured study guide for this assignment. Break the topics into sections — one ## heading per topic. Under each: brief explanation, key terms in bold, a short worked example, and a self-check question. Reference attached materials by name where relevant.">Study guide</button>
    <button data-prompt="Quiz me on this assignment. Ask one question at a time, wait for my answer, then give brief feedback and the next question. Cover all the key topics across 5-7 questions, drawing on the attached materials.">Quiz me</button>
    <button data-prompt="List ONLY the steps explicitly stated or directly implied by the assignment description and attached materials. Do not invent extra steps, deliverables, or requirements. If the description is vague, say so and list only what's literally there.">Steps</button>
  </div>
</aside>

<script src="/app.js" type="module"></script>
</body>
</html>
